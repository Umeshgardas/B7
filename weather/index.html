<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./weather.css" />
  </head>
  <body>
    <div class="app">
      <a href="./index.html">Home</a>
      <a href="../animation.html">Animation</a>

      <h2>Weather Search</h2>
      <input type="text" id="cityInput" placeholder="Enter city name..." />
      <button id="searchBtn">Search</button>

      <div id="result" class="card">No Data</div>

      <script>
        const APIkey = "3981307853b3b556ebc3c3a228618cca";
        const input = document.getElementById("cityInput");
        const result = document.getElementById("result");
        const btn = document.getElementById("searchBtn");

        async function searchWeather() {
          const city = input.value.trim();
          if (!city) return alert("Enter a valid city name");

          try {
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${APIkey}`;
            const res = await fetch(url);

            const data = await res.json();
            console.log(data);
            const icon = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
            result.innerHTML = `
            <h3>${data.name}, ${data.sys.country} </h3>
            <img src="${icon}"/>
            <p><strong>Temperatur: </strong>${data.main.temp}  </p>
            <p><strong>Humidity: </strong>${data.main.humidity}  </p>
            <p><strong>Condition: </strong>${data.weather[0].description}  </p>
            `;
          } catch (error) {
            result.innerHTML = `<p style='color:red'> Error</p> `;
          }
        }

        //

        btn.addEventListener("click", searchWeather);
      </script>
    </div>
  </body>
</html>
